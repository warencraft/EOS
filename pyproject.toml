[project]
name = "eos-engineering-operating-system"
version = "0.2.0"
description = "Engineering Operating System governance and foundation data contracts."
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.18.0"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scripts*"]

